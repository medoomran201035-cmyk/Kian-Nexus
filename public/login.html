<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Kayan ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: #0f172a; padding: 40px; border-radius: 16px; border: 1px solid #1e293b; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        .login-card img { width: 80px; height: 80px; border-radius: 14px; margin-bottom: 20px; border: 2px solid #334155; object-fit: cover; }
        .login-card h2 { font-size: 22px; color: #fff; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
        .form-group input { width: 100%; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; outline: none; }
        .login-btn { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .login-btn:hover { background: #1d4ed8; }
        .error-msg { color: #ef4444; font-size: 13px; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/80'">
        <h2>تسجيل الدخول لـ Kayan ERP</h2>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="admin@kayan.com">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••">
            </div>
            <button type="submit" class="login-btn">دخول</button>
            <div id="errorMsg" class="error-msg">البريد أو كلمة المرور غير صحيحة</div>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            let email = document.getElementById('email').value;
            let password = document.getElementById('password').value;
            let errorMsg = document.getElementById('errorMsg');

            try {
                let res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                let data = await res.json();

                if (data.success) {
                    localStorage.setItem('kayan_user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    errorMsg.style.display = 'block';
                    errorMsg.innerText = data.message || 'خطأ في البيانات';
                }
            } catch (err) {
                // وضع تجريبي محلي لو السيرفر مش شغال حالياً
                if(email === 'admin@kayan.com' && password === '123') {
                    localStorage.setItem('kayan_user', JSON.stringify({name: 'المدير التنفيذي', role: 'ADMIN'}));
                    window.location.href = 'index.html';
                } else {
                    errorMsg.style.display = 'block';
                }
            }
        }
    </script>
</body>
</html>
