<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Kayan ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: #1e293b; padding: 40px; border-radius: 12px; border: 1px solid #334155; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-card h2 { text-align: center; margin-bottom: 25px; color: #2563eb; font-size: 22px; }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; color: #94a3b8; }
        .form-group input { background: #0b0f19; border: 1px solid #334155; color: #f8fafc; padding: 12px; border-radius: 6px; outline: none; font-size: 14px; }
        .btn-login { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px; }
        .btn-login:hover { opacity: 0.9; }
        .error-msg { color: #ef4444; font-size: 12px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>تسجيل دخول - Kayan ERP</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" required placeholder="admin">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" required placeholder="123456">
            </div>
            <button type="submit" class="btn-login">دخول للنظام</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if(data.success) {
                    localStorage.setItem('kayan_user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('errorMsg').innerText = data.message || 'خطأ في بيانات الدخول';
                }
            } catch(err) {
                document.getElementById('errorMsg').innerText = 'حدث خطأ في الاتصال بالخادم';
            }
        });
    </script>
</body>
</html>
