<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - Kayan ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-96">
    <h2 class="text-2xl font-bold mb-6 text-center text-blue-400">تسجيل الدخول - كايان</h2>
    
    <div id="error-msg" class="hidden bg-red-500 text-white p-3 rounded mb-4 text-sm text-center"></div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block mb-1 text-sm">اسم المستخدم</label>
        <input type="text" id="username" required class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block mb-1 text-sm">كلمة المرور</label>
        <input type="password" id="password" required class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-blue-500">
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-bold transition duration-200">دخول</button>
    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-msg');

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('currentUser', JSON.stringify({
            username: username,
            role: data.role,
            name: data.name
          }));
          window.location.href = '/index.html';
        } else {
          errorDiv.textContent = data.message || 'خطأ في بيانات الدخول';
          errorDiv.classList.remove('hidden');
        }
      } catch (err) {
        errorDiv.textContent = 'حدث خطأ في الاتصال بالسيرفر';
        errorDiv.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
