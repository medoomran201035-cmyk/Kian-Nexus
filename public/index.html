<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayan ERP - لوحة التحكم المركزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans flex h-screen overflow-hidden">

    <!-- Sidebar (القائمة الجانبية مع شعار Kayan) -->
    <aside class="w-64 bg-gray-900 border-l border-gray-800 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="p-5 border-b border-gray-800 flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-xl text-white shadow-lg">K</div>
                <div>
                    <h1 class="font-bold text-lg text-white">Kayan ERP</h1>
                    <p class="text-xs text-gray-400">إدارة 150 موظف</p>
                </div>
            </div>

            <nav class="p-4 space-y-2">
                <a href="#" onclick="switchTab('dashboard', this)" class="nav-btn flex items-center space-x-3 space-x-reverse p-3 rounded-lg bg-blue-600 text-white font-medium transition">
                    <i class="fa-solid fa-house"></i><span>الرئيسية</span>
                </a>
                <a href="#" onclick="switchTab('tasks', this)" class="nav-btn flex items-center space-x-3 space-x-reverse p-3 rounded-lg hover:bg-gray-800 text-gray-300 transition">
                    <i class="fa-solid fa-list-check"></i><span>إدارة المهام</span>
                </a>
                <a href="#" onclick="switchTab('helpdesk', this)" class="nav-btn flex items-center space-x-3 space-x-reverse p-3 rounded-lg hover:bg-gray-800 text-gray-300 transition">
                    <i class="fa-solid fa-headset"></i><span>الدعم الفني (IT)</span>
                </a>
                <a href="#" onclick="switchTab('hr', this)" id="hrTab" class="nav-btn flex items-center space-x-3 space-x-reverse p-3 rounded-lg hover:bg-gray-800 text-gray-300 transition hidden">
                    <i class="fa-solid fa-users-gear"></i><span>شؤون الموظفين (HR)</span>
                </a>
            </nav>
        </div>

        <div class="p-4 border-t border-gray-800">
            <div class="mb-3">
                <p id="userNameDisplay" class="text-sm font-bold text-white">جار التحميل...</p>
                <p id="userRoleDisplay" class="text-xs text-blue-400">الصلاحية</p>
            </div>
            <button onclick="logout()" class="w-full bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white p-2 rounded-lg text-sm transition flex items-center justify-center space-x-2 space-x-reverse">
                <i class="fa-solid fa-arrow-right-from-bracket"></i><span>تسجيل الخروج</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <header class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center">
            <h2 id="pageTitle" class="text-xl font-bold text-white">لوحة المؤشرات العامة</h2>
            <span id="departmentBadge" class="bg-blue-900/50 text-blue-300 border border-blue-700 text-xs px-3 py-1 rounded-full">القسم: عام</span>
        </header>

        <div class="p-6 space-y-6" id="contentArea">
            <!-- المحتوى الافتراضي -->
        </div>
    </main>

    <script>
        const userId = localStorage.getItem('userId');
        const userName = localStorage.getItem('userName');
        const userRole = localStorage.getItem('userRole');
        const userDepartment = localStorage.getItem('userDepartment');

        if (!userId) {
            window.location.href = '/login.html';
        } else {
            document.getElementById('userNameDisplay').innerText = userName;
            document.getElementById('userRoleDisplay').innerText = `الدور: ${userRole.toUpperCase()}`;
            document.getElementById('departmentBadge').innerText = `القسم: ${userDepartment}`;
            if (userRole === 'admin' || userRole === 'hr') {
                document.getElementById('hrTab').classList.remove('hidden');
            }
            switchTab('dashboard');
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }

        function switchTab(tabName, element) {
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('bg-blue-600', 'text-white'));
            if(element) element.classList.add('bg-blue-600', 'text-white');

            const contentArea = document.getElementById('contentArea');
            const pageTitle = document.getElementById('pageTitle');

            if (tabName === 'dashboard') {
                pageTitle.innerText = "لوحة المؤشرات العامة";
                contentArea.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-gray-900 border border-gray-800 p-5 rounded-xl shadow-md"><p class="text-gray-400 text-sm">إجمالي الموظفين</p><h3 class="text-3xl font-bold text-blue-500 mt-2">150+</h3></div>
                        <div class="bg-gray-900 border border-gray-800 p-5 rounded-xl shadow-md"><p class="text-gray-400 text-sm">حالة النظام</p><h3 class="text-3xl font-bold text-green-500 mt-2">متصل وآمن</h3></div>
                        <div class="bg-gray-900 border border-gray-800 p-5 rounded-xl shadow-md"><p class="text-gray-400 text-sm">القسم الحالي</p><h3 class="text-xl font-bold text-yellow-500 mt-2">${userDepartment}</h3></div>
                    </div>`;
            } else if (tabName === 'tasks') {
                pageTitle.innerText = "إدارة المهام والمأموريات";
                contentArea.innerHTML = `
                    <div class="bg-gray-900 border border-gray-800 p-6 rounded-xl space-y-4">
                        <h3 class="font-bold text-lg text-blue-400">إضافة مهمة جديدة</h3>
                        <form onsubmit="addTask(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" id="taskTitle" placeholder="عنوان المهمة" required class="bg-gray-800 border border-gray-700 p-3 rounded text-white">
                            <input type="text" id="taskAssigned" placeholder="الموظف المسؤول" required class="bg-gray-800 border border-gray-700 p-3 rounded text-white">
                            <input type="text" id="taskDept" placeholder="القسم المختص" required class="bg-gray-800 border border-gray-700 p-3 rounded text-white">
                            <input type="text" id="taskDesc" placeholder="تفاصيل المهمة" required class="bg-gray-800 border border-gray-700 p-3 rounded text-white">
                            <button type="submit" class="col-span-2 bg-blue-600 hover:bg-blue-700 p-3 rounded font-semibold transition">حفظ وإرسال المهمة</button>
                        </form>
                    </div>`;
            } else if (tabName === 'helpdesk') {
                pageTitle.innerText = "نظام الدعم الفني وتذاكر الأعطال";
                contentArea.innerHTML = `
                    <div class="bg-gray-900 border border-gray-800 p-6 rounded-xl space-y-4">
                        <h3 class="font-bold text-lg text-yellow-400">فتح تذكرة دعم فني جديدة</h3>
                        <form onsubmit="addTicket(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" id="ticketSubject" placeholder="مشكلة في (طابعة، شبكة، كمبيوتر..)" required class="bg-gray-800 border border-gray-700 p-3 rounded text-white">
                            <input type="text" id="ticketDept" placeholder="القسم" required class="bg-gray-800 border border-gray-700 p-3 rounded text-white">
                            <textarea id="ticketDesc" placeholder="تفاصيل المشكلة التقنية..." required class="col-span-2 bg-gray-800 border border-gray-700 p-3 rounded text-white"></textarea>
                            <button type="submit" class="col-span-2 bg-yellow-600 hover:bg-yellow-700 p-3 rounded font-semibold transition">إرسال التذكرة لفريق الـ IT</button>
                        </form>
                    </div>`;
            } else if (tabName === 'hr') {
                pageTitle.innerText = "شؤون الموظفين وإنشاء الحسابات";
                contentArea.innerHTML = `
                    <div class="bg-gray-900 border border-gray-800 p-6 rounded-xl space-y-4">
                        <h3 class="font-bold text-lg text-blue-400">إنشاء حساب موظف جديد (من 150 موظف)</h3>
                        <form onsubmit="createEmployee(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" id="empName" placeholder="اسم الموظف الثلاثي" required class="bg-gray-800 border border-gray-700 p-3 rounded text-white">
                            <input type="email" id="empEmail" placeholder="البريد الإلكتروني" required class="bg-gray-800 border border-gray-700 p-3 rounded text-white">
                            <input type="password" id="empPassword" placeholder="كلمة المرور" required class="bg-gray-800 border border-gray-700 p-3 rounded text-white">
                            <select id="empDepartment" class="bg-gray-800 border border-gray-700 p-3 rounded text-white">
                                <option value="IT">IT</option><option value="HR">HR</option><option value="Finance">Finance</option><option value="Sales">Sales</option>
                            </select>
                            <select id="empRole" class="bg-gray-800 border border-gray-700 p-3 rounded text-white">
                                <option value="employee">موظف عادي</option><option value="hr">مسؤول HR</option><option value="admin">أدمن</option>
                            </select>
                            <button type="submit" class="col-span-2 bg-blue-600 hover:bg-blue-700 p-3 rounded font-semibold transition">إنشاء الحساب</button>
                        </form>
                    </div>`;
            }
        }

        async function addTask(e) {
            e.preventDefault();
            const body = {
                title: document.getElementById('taskTitle').value,
                assignedTo: document.getElementById('taskAssigned').value,
                department: document.getElementById('taskDept').value,
                description: document.getElementById('taskDesc').value
            };
            const res = await fetch('/api/tasks/add', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            if((await res.json()).success) { alert('تم اضافة المهمة بنجاح'); e.target.reset(); }
        }

        async function addTicket(e) {
            e.preventDefault();
            const body = {
                subject: document.getElementById('ticketSubject').value,
                department: document.getElementById('ticketDept').value,
                description: document.getElementById('ticketDesc').value,
                createdBy: userName
            };
            const res = await fetch('/api/tickets/add', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            if((await res.json()).success) { alert('تم فتح التذكرة بنجاح'); e.target.reset(); }
        }

        async function createEmployee(e) {
            e.preventDefault();
            const body = {
                requesterId: userId,
                name: document.getElementById('empName').value,
                email: document.getElementById('empEmail').value,
                password: document.getElementById('empPassword').value,
                department: document.getElementById('empDepartment').value,
                role: document.getElementById('empRole').value
            };
            const res = await fetch('/api/users/create', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            const data = await res.json();
            if(data.success) { alert('تم إنشاء الموظف بنجاح'); e.target.reset(); } else { alert(data.message); }
        }
    </script>
</body>
</html>
