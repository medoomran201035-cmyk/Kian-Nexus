<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <title>Kian-Nexus - لوحة إدارة العقارات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-6">

    <!-- حاوية الترحيب بالبداية الجديدة -->

        <div class="grid grid-cols-2 gap-3 text-xs font-semibold">
            <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 text-slate-600">
                <i class="fa-solid fa-server ml-1 text-emerald-600"></i> Express Server Ready
            </div>
            <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 text-slate-600">
